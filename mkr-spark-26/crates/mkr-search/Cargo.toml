[package]
name = "mkr-search"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MKR independent search subsystem: safe HTTP, HTML extraction, provider abstraction, ranking, caching, citations"

[dependencies]
mkr-core = { path = "../mkr-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# TLS: rustls elsewhere; on Windows use the OS TLS stack (schannel) so no C/asm toolchain is needed
# and corporate root certificates are honoured.
[target.'cfg(not(windows))'.dependencies]
ureq = "2"
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
